<!-- Banner Universal de Ambiente de Pruebas -->
<aside *ngIf="isTesting" 
       class="testing-banner-container bg-gradient-to-r from-amber-400 via-amber-500 to-amber-400 text-slate-950 font-medium px-3 py-1.5 shadow-sm border-b border-amber-600/30 sticky top-0 z-[99999]"
       role="alert"
       aria-label="Aviso de entorno de pruebas">
  
  <!-- Vista Completa -->
  <div class="max-w-7xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-2" *ngIf="!isBannerMinimized">
    <div class="flex items-center gap-2.5 flex-wrap justify-center sm:justify-start">
      <span class="px-2.5 py-0.5 rounded-full bg-slate-900 text-amber-300 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5 shrink-0 shadow-2xs">
        <i class="bi bi-cone-striped text-amber-400"></i> ENTORNO DE PRUEBAS
      </span>
      <span class="text-xs font-bold leading-tight text-center sm:text-left text-slate-900">
        ⚠️ <strong>Atención:</strong> Esta es una <u>versión preliminar de pruebas</u> antes de su despliegue en producción. Los datos registrados pueden eliminarse, resetearse o tener modificaciones sin previo aviso.
      </span>
    </div>
    
    <button type="button" 
            (click)="toggleBanner()" 
            class="px-2 py-0.5 bg-slate-900/10 hover:bg-slate-900/20 text-slate-900 rounded-lg text-[10px] font-black transition cursor-pointer shrink-0"
            title="Minimizar aviso">
      <i class="bi bi-chevron-up mr-1"></i>Minimizar
    </button>
  </div>

  <!-- Vista Minimizada -->
  <div class="max-w-7xl mx-auto w-full flex items-center justify-between" *ngIf="isBannerMinimized">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 rounded-full bg-slate-900 text-amber-300 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5 shadow-2xs">
        <i class="bi bi-cone-striped text-amber-400"></i> ENTORNO DE PRUEBAS
      </span>
      <span class="text-[11px] font-bold text-slate-900 hidden md:inline">
        Versión preliminar no productiva
      </span>
    </div>
    
    <button type="button" 
            (click)="toggleBanner()" 
            class="px-2 py-0.5 bg-slate-900/10 hover:bg-slate-900/20 text-slate-900 rounded-lg text-[10px] font-black transition cursor-pointer"
            title="Expandir aviso completo">
      <i class="bi bi-chevron-down mr-1"></i>Ver aviso completo
    </button>
  </div>

</aside>
