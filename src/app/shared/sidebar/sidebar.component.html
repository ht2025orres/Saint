<!-- Overlay para móvil / tablet (< 992px) -->
<div class="sidebar-overlay" *ngIf="isMobile && isMobileOpen" (click)="closeMobileSidebar()" aria-label="Cerrar menú">
</div>

<aside class="left-sidebar saint-sidebar" [class.mobile-open]="isMobile && isMobileOpen">
  <div class="sidebar-surface">
    <!-- Brand + Close button -->
    <div class="sidebar-brand">
      <a class="brand-block" routerLink="/dashboard" (click)="closeMobileSidebar()">
        <img src="assets/images/logo (1).png" alt="SaINT" class="brand-logo" />
      </a>
      <button type="button" class="sidebar-close-btn" aria-label="Cerrar menú" (click)="closeMobileSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Navegación móvil principal -->
    <div class="sidebar-content">
      <div class="scroll-sidebar saint-scroll-sidebar">
        <nav class="sidebar-nav saint-sidebar-nav">
          <ul class="sidebar-list saint-sidebar-list">
            
            <!-- Inicio directo -->
            <li class="sidebar-item">
              <a class="sidebar-link sidebar-home-link" 
                 routerLink="/dashboard" 
                 routerLinkActive="active"
                 [routerLinkActiveOptions]="{ exact: true }"
                 (click)="closeMobileSidebar()">
                <div class="home-icon-wrap">
                  <i class="bi bi-speedometer2"></i>
                </div>
                <span class="saint-menu-label">Inicio</span>
              </a>
            </li>

            <!-- Separador / Sección -->
            <li class="sidebar-section-divider">
              <span>ÁREAS DEL SISTEMA</span>
            </li>

            <!-- Áreas dinámicas consolidadas -->
            <ng-container *ngFor="let area of areas">
              <li *ngIf="canShowArea(area)" class="sidebar-area-item" [style.--area-color]="area.color">
                
                <!-- Botón Acordeón del Área -->
                <button type="button" 
                        class="sidebar-area-btn" 
                        [class.expanded]="area.isOpen"
                        (click)="toggleArea(area)">
                  <div class="area-btn-left">
                    <span class="area-icon-wrap" [style.color]="area.color">
                      <i [class]="area.icon"></i>
                    </span>
                    <span class="area-title">{{ area.label }}</span>
                  </div>
                  <i class="bi bi-chevron-down area-chevron" [class.chevron-open]="area.isOpen"></i>
                </button>

                <!-- Contenedor desplegable del Área -->
                <div class="sidebar-area-body" *ngIf="area.isOpen">
                  <div *ngFor="let mod of getVisibleModules(area)" class="sidebar-module-block">
                    
                    <!-- Encabezado del Módulo (ej. Clientes y Órdenes, Finanzas, etc.) -->
                    <div class="sidebar-module-header">
                      <i [class]="mod.icon || 'bi bi-folder'" class="mod-icon" [style.color]="area.color"></i>
                      <span class="mod-label">{{ mod.label }}</span>
                    </div>

                    <!-- Lista de Sub-interfaces / Pantallas -->
                    <ul class="sidebar-sub-list">
                      <li *ngFor="let sub of getVisibleSubInterfaces(mod)">
                        <a class="sidebar-sub-link"
                           [routerLink]="sub.link"
                           routerLinkActive="active"
                           [routerLinkActiveOptions]="{ exact: true }"
                           (click)="closeMobileSidebar()">
                          <i [class]="sub.icon || 'bi bi-chevron-right'" class="sub-arrow"></i>
                          <span>{{ sub.label }}</span>
                        </a>
                      </li>
                    </ul>

                  </div>
                </div>

              </li>
            </ng-container>

          </ul>
        </nav>
      </div>
    </div>

    <!-- Footer de Usuario & Sesión -->
    <div class="sidebar-footer">
      <a class="sidebar-utility"
         routerLink="/my-profile"
         routerLinkActive="active"
         (click)="closeMobileSidebar()">
        <i class="bi bi-person-gear utility-icon"></i>
        <span class="utility-text">Mi Perfil</span>
      </a>

      <div class="sidebar-user-card">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-meta">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role" *ngIf="userPerfil">{{ userPerfil }}</span>
        </div>
        <button type="button"
                (click)="logout()"
                class="user-action"
                title="Cerrar sesión"
                aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>

  </div>
</aside>
