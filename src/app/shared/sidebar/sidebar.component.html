<!-- Overlay para móvil -->
<div class="sidebar-overlay" *ngIf="isMobile && isMobileOpen" (click)="closeMobileSidebar()" aria-label="Cerrar menú">
</div>

<aside class="left-sidebar saint-sidebar" [class.collapsed]="!isMobile && isCollapsed"
  [class.mobile-open]="isMobile && isMobileOpen">
  <div class="sidebar-surface">
    <div class="sidebar-brand">
      <a class="brand-block" routerLink="/dashboard">
        <img src="../../../assets/images/logo (1).png" alt="SaINT" class="brand-logo collapse-label" />
      </a>
      <button type="button" class="sidebar-toggle" aria-label="Alternar tamaño del menú" (click)="toggleSidebar()">
        <i class="bi" [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>

    <div class="sidebar-content">
      <div class="scroll-sidebar saint-scroll-sidebar">
        <nav class="sidebar-nav saint-sidebar-nav">
          <ul id="sidebarnav" class="sidebar-list saint-sidebar-list">
            <ng-container *ngFor="let item of menuItems">
              <li *ngIf="canShowMenuItem(item)">
                <!-- Item sin submenú -->
                <a *ngIf="!item.submenu" 
                   class="sidebar-link waves-effect waves-dark" 
                   [routerLink]="item.link" 
                   routerLinkActive="active">
                  <i [class]="item.icon"></i>
                  <span class="hide-menu saint-menu-label">{{ item.label }}</span>
                </a>

                <!-- Item con submenú -->
                <ng-container *ngIf="item.submenu">
                  <a class="sidebar-link has-arrow waves-effect waves-dark" 
                     href="javascript:void(0)" 
                     [attr.aria-expanded]="item.isOpen"
                     (click)="toggleSubmenu(item)"
                     (mouseenter)="openFloatPanel(item.submenu, $event)" 
                     (mouseleave)="closeFloatPanel()">
                    <i [class]="item.icon"></i>
                    <span class="hide-menu saint-menu-label">{{ item.label }}</span>
                    <i class="bi bi-chevron-right arrow-icon"></i>
                  </a>
                  <ul [class.show]="item.isOpen" class="collapse sidebar-submenu">
                    <ng-container *ngFor="let sub of item.submenu">
                      <li *ngIf="canShowMenuItem(sub)">
                        <a class="sidebar-sublink" 
                           [routerLink]="sub.link" 
                           routerLinkActive="active">
                          {{ sub.label }}
                        </a>
                      </li>
                    </ng-container>
                  </ul>
                </ng-container>
              </li>
            </ng-container>
          </ul>
        </nav>
      </div>
    </div>
    <div class="sidebar-footer">

      <a class="sidebar-utility"
        [routerLink]="['/my-profile']"
        routerLinkActive="active">
        <i class="bi bi-gear utility-icon"></i>
        <span class="utility-text collapse-label">Configuración</span>
      </a>

      <div class="sidebar-user-card">
          <div class="user-avatar">{{ userInitials }}</div>
          <div class="user-meta collapse-label">
            <span class="user-name">{{ userName }}</span>

          </div>

          <a (click)="logout()"
          style="cursor: pointer"
          class="user-action"
          title="Cerrar sesión"
          aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>
</aside>
<!-- Panel flotante cuando sidebar está colapsado -->
<div class="sidebar-float-panel" *ngIf="isCollapsed && hoveredSubmenu && !isMobile" [style.top.px]="floatPanelTop"
  (mouseenter)="keepFloatPanelOpen()" (mouseleave)="closeFloatPanel()">
  <ul class="floating-submenu">
    <li *ngFor="let item of hoveredSubmenu">
      <a [routerLink]="item.link" routerLinkActive="active">{{ item.label }}</a>
    </li>
  </ul>
</div>
