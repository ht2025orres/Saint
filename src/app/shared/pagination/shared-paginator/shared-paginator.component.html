    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-center gap-3 w-100" 
         *ngIf="paginationState?.paginator && paginationState.paginator.totalElements > 0" 
         [attr.data-paginator-id]="instanceId">
      
      <!-- Text Info (No rigid column restriction) -->
      <div class="text-muted responsive-text text-center text-lg-start" style="white-space: nowrap;">
        Mostrando del <span class="fw-bold">{{ getStartIndex() }}</span> al <span class="fw-bold">{{ getEndIndex() }}</span> de <span class="fw-bold">{{ paginationState.paginator.totalElements }}</span> entrada(s)
      </div>
      
      <!-- Controls -->
      <div class="d-flex flex-wrap justify-content-center justify-content-lg-end align-items-center gap-3">
        
        <!-- Page size selector -->
        <div class="d-flex align-items-center" *ngIf="showPageSizeSelector">
            <label class="me-2 responsive-text mb-0 text-muted">Mostrar:</label>
            <select class="form-select form-select-sm" style="width: auto;"
                    [(ngModel)]="paginationState.paginator.size"
                    (ngModelChange)="onPageSizeChange($event)">
            <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }}</option>
            </select>
        </div>
        
        <!-- Paginator buttons -->
        <div class="d-flex flex-wrap align-items-center gap-1 responsive-text" 
             *ngIf="paginationState.pages?.length > 0">
          
          <!-- Botón Primera Página -->
          <a class="paginate_button previous" 
             *ngIf="paginationState.paginator.number > 0" 
             (click)="goToFirstPage()"
             title="Ir a la primera página">
            <i class="bi bi-chevron-double-left"></i>
          </a>

          <!-- Botón Anterior -->
          <a class="paginate_button previous" 
             *ngIf="paginationState.paginator.number > 0" 
             (click)="changePage(paginationState.paginator.number - 1)">
            Anterior
          </a>
          
          <ng-container *ngFor="let pagina of paginationState.pages">
            <span *ngIf="pagina - 1 === paginationState.paginator.number" 
                  class="paginate_button current">
              {{ pagina }}
            </span>
            <a *ngIf="pagina - 1 !== paginationState.paginator.number" 
               (click)="changePage(pagina - 1)" 
               class="paginate_button">
              {{ pagina }}
            </a>
          </ng-container>
          
          <!-- Botón Siguiente -->
          <a *ngIf="paginationState.paginator.number < paginationState.paginator.totalPages - 1" 
             (click)="changePage(paginationState.paginator.number + 1)"
             class="paginate_button next">
            Siguiente
          </a>

          <!-- Botón Última Página -->
          <a *ngIf="paginationState.paginator.number < paginationState.paginator.totalPages - 1" 
             (click)="goToLastPage()"
             class="paginate_button next"
             title="Ir a la última página">
            <i class="bi bi-chevron-double-right"></i>
          </a>

          <!-- Salto directo a número de página -->
          <div class="d-flex align-items-center ms-2 bg-light px-2 py-1 rounded border">
            <span class="me-1 text-muted text-xs">Pág</span>
            <input type="number" 
                   [value]="paginationState.paginator.number + 1"
                   min="1"
                   [max]="paginationState.paginator.totalPages"
                   (change)="onPageInputSubmit($event)"
                   (keyup.enter)="onPageInputSubmit($event)"
                   class="form-control form-control-sm text-center px-1 font-weight-bold" 
                   style="width: 48px; height: 26px; font-size: 11px;">
            <span class="ms-1 text-muted text-xs">de {{ paginationState.paginator.totalPages }}</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Mensaje cuando no hay datos -->
    <div class="w-100" *ngIf="!loading && paginationState?.paginator && paginationState.paginator.totalElements === 0">
      <div class="text-center p-4">
        <p class="text-muted">{{ noDataMessage }}</p>
      </div>
    </div>
