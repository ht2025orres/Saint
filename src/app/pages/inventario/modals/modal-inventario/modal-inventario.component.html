<div *ngIf="show" 
     class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300"
     (click)="cerrar()">
    
    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 animate-in zoom-in-95 duration-300"
         (click)="$event.stopPropagation()">
        
        <!-- Header -->
        <div class="relative px-8 py-6 border-b border-slate-100 bg-slate-50/50">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-lg shadow-amber-200">
                    <i class="bi bi-calendar-check text-xl"></i>
                </div>
                <div>
                    <h2 class="font-black text-slate-800 text-xl tracking-tight">Nuevo Inventario</h2>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-0.5">Configure un nuevo periodo de inventario</p>
                </div>
            </div>
            <button (click)="cerrar()" class="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-all">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="px-8 py-8 space-y-6">
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Nombre del Inventario <span class="text-rose-500">*</span></label>
                <input type="text" [(ngModel)]="nuevoInventario.nombre"
                       placeholder="Ej: Inventario Mensual Abril"
                       class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Fecha de Inicio <span class="text-rose-500">*</span></label>
                <input type="date" [(ngModel)]="nuevoInventario.fecha_inicio"
                       class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-all cursor-pointer">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Descripción</label>
                <textarea [(ngModel)]="nuevoInventario.descripcion" rows="2"
                          placeholder="Propósito de este inventario..."
                          class="w-full px-4 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-sm font-medium text-slate-600 outline-none focus:border-blue-500 focus:bg-white transition-all resize-none"></textarea>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-8 py-6 bg-slate-50/50 border-t border-slate-100 flex justify-end gap-3">
            <button (click)="cerrar()" 
                    class="px-6 py-3 text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors">
                Cancelar
            </button>
            <button (click)="guardar()" [disabled]="!nuevoInventario.nombre || !nuevoInventario.fecha_inicio || saving"
                    class="px-8 py-3 bg-amber-500 text-white text-sm font-bold rounded-2xl hover:bg-amber-600 transition-all shadow-lg shadow-amber-200 disabled:opacity-50 active:scale-95">
                {{ saving ? 'Iniciando...' : 'Iniciar Inventario' }}
            </button>
        </div>
    </div>
</div>
