<div>
    <!-- Calendar Navigation -->
    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <select class="form-select bg-white border border-slate-200 rounded-lg font-black text-sm text-slate-800 cursor-pointer focus:ring-2 focus:ring-indigo-50 px-3 py-1.5 shadow-sm w-24" 
                        [ngModel]="viewDate.getMonth()" (change)="onMonthSelect($event.target.value)">
                    <option *ngFor="let month of monthNames; let i = index" [value]="i" class="text-slate-800">{{ month }}</option>
                </select>
                        <select class="form-select bg-white border border-slate-200 rounded-lg font-black text-sm text-indigo-600 cursor-pointer focus:ring-2 focus:ring-indigo-50 px-3 py-1.5 shadow-sm w-28" 
                                [ngModel]="viewDate.getFullYear()" (change)="onYearSelect($event.target.value)">
                            <option *ngFor="let year of years" [value]="year" class="text-slate-800">{{ year }}</option>
                        </select>
            </div>

            <div class="flex bg-white rounded-lg border border-slate-200 p-1 shadow-sm">
                <button (click)="onPrevClick()" class="p-1.5 hover:bg-slate-50 rounded-md transition-colors text-slate-600">
                    <i class="bi bi-chevron-left text-xs"></i>
                </button>
                <button (click)="onNextClick()" class="p-1.5 hover:bg-slate-50 rounded-md transition-colors text-slate-600">
                    <i class="bi bi-chevron-right text-xs"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div *ngIf="startDate" class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 px-3 py-1.5 rounded-lg">
                <span class="text-[9px] font-black text-indigo-400 uppercase tracking-widest">Rango:</span>
                <span class="text-[10px] font-black text-indigo-800">{{ startDate | date:'dd/MM' }} {{ endDate ? ' → ' + (endDate | date:'dd/MM') : '' }}</span>
                <button (click)="onConsultarClick()" [disabled]="loadingItems"
                        class="px-3 py-1 bg-indigo-600 text-white rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-indigo-700 transition-all">
                    <i class="bi" [ngClass]="loadingItems ? 'bi-hourglass-split animate-spin' : 'bi-check-lg'"></i>
                    Aplicar
                </button>
                <button (click)="onResetClick()" 
                        class="p-1 text-rose-400 hover:text-rose-600 transition-colors">
                    <i class="bi bi-x-lg text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="p-5">
        <div class="grid grid-cols-7 gap-2">
            <!-- Day Headers -->
            <div *ngFor="let dayName of ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb']" 
                class="text-center py-2 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                {{ dayName }}
            </div>

            <!-- Empty cells -->
            <div *ngFor="let empty of [].constructor(firstDayOffset)" class="aspect-square bg-slate-50/30 rounded-xl"></div>

            <!-- Day cells -->
            <div *ngFor="let day of days" 
                (click)="onDayClick(day)"
                class="calendar-day aspect-square relative rounded-xl border transition-all p-2 group cursor-pointer"
                [ngClass]="{
                    'bg-white border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/30': !day.hasEvents,
                    'bg-indigo-50 border-indigo-100 hover:bg-indigo-100 shadow-sm': day.hasEvents,
                    'ring-2 ring-indigo-400 border-indigo-500 !bg-indigo-600 !text-white z-10': isStartDate(day.date) || isEndDate(day.date),
                    'bg-indigo-100 border-indigo-200': isInRange(day.date)
                }">
                
                <span class="text-[11px] font-black transition-colors"
                    [ngClass]="{
                        'text-white': isStartDate(day.date) || isEndDate(day.date),
                        'text-indigo-600': day.hasEvents && !isStartDate(day.date) && !isEndDate(day.date),
                        'text-slate-300 group-hover:text-slate-500': !day.hasEvents && !isStartDate(day.date) && !isEndDate(day.date)
                    }">
                    {{ day.day }}
                </span>

                <div *ngIf="day.hasEvents" class="mt-0.5">
                    <span class="text-lg font-black leading-none"
                        [ngClass]="isStartDate(day.date) || isEndDate(day.date) ? 'text-white' : 'text-indigo-800'">
                        {{ day.totalEvents }}
                    </span>
                </div>

                <!-- Today Indicator -->
                <div *ngIf="isToday(day.date)" class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full"
                    [ngClass]="isStartDate(day.date) || isEndDate(day.date) ? 'bg-white' : 'bg-indigo-600'">
                </div>
            </div>
        </div>
    </div>
</div>
