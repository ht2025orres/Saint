<div class="h-full bg-slate-50 p-2 sm:p-3 font-sans text-black flex flex-col overflow-hidden">
  <div class="flex-1 bg-white shadow-lg rounded-xl border border-slate-200/80 overflow-hidden flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-100 px-4 py-2 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-indigo-500 text-white flex items-center justify-center text-xs shadow-md shadow-indigo-200/50">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <div>
          <h1 class="text-xs font-extrabold text-black m-0 leading-tight">{{ title }}</h1>
          <p class="text-slate-500 text-[9px] font-semibold tracking-widest uppercase m-0">Saint · Inconsistencias</p>
        </div>
      </div>
      <nav class="hidden sm:block">
        <ol class="flex items-center gap-1.5 text-[11px] font-medium">
          <li><a routerLink="/dashboard" class="text-indigo-600 hover:underline">Inicio</a></li>
          <li class="text-slate-300">/</li>
          <li class="text-black font-semibold">{{ title }}</li>
        </ol>
      </nav>
    </header>

    <!-- FORMULARIO -->
    <div class="flex-1 overflow-hidden flex flex-col">
      <form [formGroup]="inconsistenciaForm" enctype="multipart/form-data" novalidate class="flex-1 flex flex-col overflow-hidden">

        <!-- Contenedor Principal (12 columnas) -->
        <div class="flex-1 px-5 py-3 overflow-y-auto">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-x-4 gap-y-2.5">

            <!-- 1. Fecha (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="fecha" class="text-[9px] font-bold text-black uppercase tracking-wide">Fecha</label>
              <input type="date" id="fecha" formControlName="fecha" disabled
                     class="w-full px-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] text-slate-600 cursor-not-allowed outline-none">
            </div>

            <!-- 2. Consecutivo (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="codigo_inconsistencia" class="text-[9px] font-bold text-black uppercase tracking-wide">Consecutivo</label>
              <input type="text" id="codigo_inconsistencia" formControlName="codigo_inconsistencia" readonly
                     class="w-full px-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] text-slate-600 cursor-not-allowed outline-none">
            </div>

            <!-- 3. Jefe Inmediato (4/12) -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-0.5">
              <label for="lider_nombre" class="text-[9px] font-bold text-black uppercase tracking-wide">Jefe Inmediato</label>
              <input type="text" id="lider_nombre" formControlName="lider_nombre" readonly
                     class="w-full px-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] text-slate-600 cursor-not-allowed outline-none">
              <input type="hidden" formControlName="jefe_inmediato">
            </div>

            <!-- 4. Proceso (4/12) -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-0.5">
              <label for="nombre_proceso" class="text-[9px] font-bold text-black uppercase tracking-wide">Proceso</label>
              <input type="text" id="nombre_proceso" formControlName="nombre_proceso" readonly
                     class="w-full px-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] text-slate-600 cursor-not-allowed outline-none">
            </div>

            <!-- SEPARADOR -->
            <div class="col-span-1 md:col-span-12 my-0.5 border-t border-slate-100"></div>

            <!-- 5. Cliente (4/12) -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-0.5">
              <label for="cliente" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Cliente <span class="text-rose-500">*</span>
              </label>
              <input list="clientes" id="cliente" formControlName="cliente" autocomplete="off" placeholder="Buscar cliente..."
                     (change)="assingCustomerValues($event.target)" (keyup)="searchCustomer($event.target)"
                     class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none transition-all font-medium"
                     [class.border-rose-400]="inconsistenciaForm.get('cliente')?.invalid && inconsistenciaForm.get('cliente')?.touched">
              <datalist id="clientes">
                <option *ngFor="let customer of customers" [value]="customer.customerId + ' - ' + customer.customerName"></option>
              </datalist>
            </div>

            <!-- 6. Tipo Inconsistencia (4/12) -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-0.5">
              <label for="inconsistencia" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Tipo Inconsistencia <span class="text-rose-500">*</span>
              </label>
              <select id="inconsistencia" formControlName="inconsistencia"
                      class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium cursor-pointer"
                      [class.border-rose-400]="inconsistenciaForm.get('inconsistencia')?.invalid && inconsistenciaForm.get('inconsistencia')?.touched">
                <option value="" disabled hidden>Seleccione una opción</option>
                <option *ngFor="let key of tipos | keyvalue" [value]="key.key">{{ key.value }}</option>
              </select>
            </div>

            <!-- 7. Tipo Orden (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="tipo_inco" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Tipo Orden <span class="text-rose-500">*</span>
              </label>
              <select id="tipo_inco" formControlName="tipo_inco"
                      class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium cursor-pointer">
                <option value="" disabled hidden>Seleccione</option>
                <option value="OP">OP</option>
                <option value="OPR">OPR</option>
                <option value="OPM">OPM</option>
              </select>
            </div>

            <!-- 8. Código Orden (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="codigo" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Código Orden <span class="text-rose-500">*</span>
              </label>
              <div class="flex items-stretch gap-1">
                <input type="text" id="codigo" placeholder="Código..." formControlName="codigo"
                       list="codigos-ordenes" autocomplete="off"
                       class="flex-1 min-w-0 px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium"
                       [class.border-rose-400]="inconsistenciaForm.get('codigo')?.invalid && inconsistenciaForm.get('codigo')?.touched">
                <button type="button" (click)="consultarItem()" [disabled]="!inconsistenciaForm.get('codigo')?.value"
                        class="px-2 py-1 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:text-slate-500 text-white text-[11px] font-bold rounded transition-all flex items-center justify-center shrink-0">
                  <i class="fas fa-search"></i>
                </button>
              </div>
              <datalist id="codigos-ordenes">
                <option *ngFor="let orden of ordenesDisponibles" [value]="orden.codigo">{{ orden.codigo }}</option>
              </datalist>
            </div>

            <!-- 9. Ítem (4/12) -->
            <div class="col-span-1 md:col-span-4 flex flex-col gap-0.5">
              <label for="nombre_item" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Ítem <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="nombre_item" formControlName="nombre_item" list="items-disponibles" autocomplete="off"
                     placeholder="Seleccione un ítem..." (change)="onItemSelect($event)"
                     class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium"
                     [class.border-rose-400]="inconsistenciaForm.get('nombre_item')?.invalid && inconsistenciaForm.get('nombre_item')?.touched">
              <datalist id="items-disponibles">
                <option *ngFor="let mat of itemsDisponibles" [value]="mat.id_material">
                  {{ mat.id_material }} - {{ mat.descripcion_material }}{{ mat.color_material ? ' | ' + mat.color_material : '' }}{{ mat.talla_material ? ' | ' + mat.talla_material : '' }}
                </option>
              </datalist>
            </div>

            <!-- 10. Cantidad Solicitada (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="cantidad_solicitada_op" class="text-[9px] font-bold text-black uppercase tracking-wide">Cant. Solicitada</label>
              <input type="text" id="cantidad_solicitada_op" formControlName="cantidad_solicitada_op" (input)="formatearMiles($event)" inputmode="numeric"
                     class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium">
            </div>

            <!-- 11. Cantidad Inconsistencia (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="cantidad_inco" class="text-[9px] font-bold text-black uppercase tracking-wide flex items-center justify-between">
                <span>Cant. Inconsistencia <span class="text-rose-500">*</span></span>
                <span *ngIf="inconsistenciaForm.get('cantidad_inco')?.hasError('cantidadExcedida') && inconsistenciaForm.get('cantidad_inco')?.touched" class="text-[8px] text-rose-500 font-bold lowercase tracking-normal">Excede solic.</span>
              </label>
              <div class="flex items-stretch gap-1">
                <input type="text" id="cantidad_inco" formControlName="cantidad_inco" (input)="formatearMiles($event)" inputmode="numeric"
                       class="flex-1 min-w-0 px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium"
                       [class.border-rose-400]="inconsistenciaForm.get('cantidad_inco')?.invalid && inconsistenciaForm.get('cantidad_inco')?.touched">
                <select id="unidad_medida" formControlName="unidad_medida"
                        class="w-14 px-1 py-1 bg-white border border-slate-300 rounded text-[10px] text-black focus:border-indigo-500 outline-none font-medium cursor-pointer shrink-0 text-center">
                  <option value="unidades">Uds</option>
                  <option value="metros">Mts</option>
                  <option value="centimetros">Cms</option>
                </select>
              </div>
            </div>

            <!-- 12. Precio Unitario (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="precio_unitario" class="text-[9px] font-bold text-black uppercase tracking-wide flex items-center justify-between">
                <span>Precio Unid. <span class="text-rose-500">*</span></span>
                <span *ngIf="isPrecioVacioOCero()" class="text-[8px] text-amber-600 font-bold lowercase tracking-normal">Requerido</span>
              </label>
              <div class="relative">
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[11px] text-slate-500 font-medium">$</span>
                <input type="text" id="precio_unitario" formControlName="precio_unitario" (input)="formatearMiles($event)" inputmode="decimal"
                       placeholder="0"
                       class="w-full pl-5 pr-6 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium"
                       [class.border-rose-400]="inconsistenciaForm.get('precio_unitario')?.invalid && inconsistenciaForm.get('precio_unitario')?.touched">
                <span *ngIf="isPrecioVacioOCero()" class="absolute right-2 top-1/2 -translate-y-1/2">
                  <i class="fas fa-exclamation-triangle text-amber-500 text-[9px]"></i>
                </span>
              </div>
            </div>

            <!-- 13. Precio Total (2/12) -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-0.5">
              <label for="precio_total" class="text-[9px] font-bold text-black uppercase tracking-wide">Precio Total</label>
              <div class="relative">
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[11px] text-slate-500 font-medium">$</span>
                <input type="text" id="precio_total" formControlName="precio_total" readonly
                       class="w-full pl-5 pr-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] text-slate-600 cursor-not-allowed outline-none">
              </div>
            </div>

            <!-- 14. Descripción Ítem (12/12) -->
            <div class="col-span-1 md:col-span-12 flex flex-col gap-0.5">
              <label for="item" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Descripción Ítem <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="item" formControlName="item" placeholder="Descripción extendida del ítem..."
                     class="w-full px-2 py-1 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium"
                     [class.border-rose-400]="inconsistenciaForm.get('item')?.invalid && inconsistenciaForm.get('item')?.touched">
            </div>

            <!-- SEPARADOR -->
            <div class="col-span-1 md:col-span-12 my-0.5 border-t border-slate-100"></div>

            <!-- 15. Situación (6/12 o 12/12 si no hay acción) -->
            <div class="col-span-1 flex flex-col gap-0.5" [ngClass]="mostrarTablaAccion ? 'md:col-span-6' : 'md:col-span-12'">
              <label for="situacion" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Situación Presentada <span class="text-rose-500">*</span>
              </label>
              <textarea id="situacion" formControlName="situacion" rows="2" placeholder="Describa la situación presentada detalladamente..."
                        class="w-full px-2 py-1.5 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium resize-none leading-relaxed"
                        [class.border-rose-400]="inconsistenciaForm.get('situacion')?.invalid && inconsistenciaForm.get('situacion')?.touched"></textarea>
            </div>

            <!-- 16. Acción Correctiva (6/12) -->
            <div *ngIf="mostrarTablaAccion" class="col-span-1 md:col-span-6 flex flex-col gap-0.5">
              <label for="accion" class="text-[9px] font-bold text-black uppercase tracking-wide">
                Acción Correctiva <span *ngIf="accionObligatoria" class="text-rose-500">*</span>
              </label>
              <textarea id="accion" formControlName="accion" rows="2" placeholder="Acciones correctivas a implementar..."
                        class="w-full px-2 py-1.5 bg-white border border-slate-300 rounded text-[11px] text-black focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 outline-none font-medium resize-none leading-relaxed"
                        [class.border-rose-400]="inconsistenciaForm.get('accion')?.invalid && inconsistenciaForm.get('accion')?.touched"></textarea>
            </div>

            <!-- 17. Evidencias (12/12 inline) -->
            <div *ngIf="mostrarGrupoImagenes" class="col-span-1 md:col-span-12 mt-1">
              <div class="flex items-center gap-2 mb-1">
                <label class="text-[9px] font-bold text-black uppercase tracking-wide">Evidencias</label>
                <span class="text-[8px] px-1.5 py-0.5 rounded-sm font-bold uppercase"
                      [class]="imagenesObligatorias ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-slate-100 text-slate-600 border border-slate-200'">
                  {{ imagenesObligatorias ? 'Requerido' : 'Opcional' }}
                </span>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="relative flex items-center gap-1.5 border border-dashed border-slate-300 rounded bg-slate-50/50 px-3 py-1 hover:border-indigo-400 hover:bg-indigo-50/30 transition-all cursor-pointer group shrink-0">
                  <input type="file" id="evidencias" (change)="onFileChange($event)" multiple
                         accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv"
                         class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                  <i class="fas fa-cloud-upload-alt text-indigo-500 text-[10px] group-hover:text-indigo-600 transition-colors pointer-events-none"></i>
                  <span class="text-[10px] font-semibold text-black group-hover:text-indigo-700 transition-colors pointer-events-none">Subir archivos</span>
                </div>
                <ng-container *ngIf="nombresArchivos.length > 0">
                  <span *ngFor="let nombre of nombresArchivos"
                        class="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-50 border border-emerald-200 rounded text-[9px] text-emerald-800 font-medium">
                    <i class="fas fa-check-circle text-emerald-500 text-[8px]"></i>
                    <span class="truncate max-w-[200px]">{{ nombre }}</span>
                  </span>
                </ng-container>
              </div>
            </div>

          </div>
        </div>

        <!-- FOOTER -->
        <div class="flex items-center justify-between px-5 py-2 border-t border-slate-100 bg-white shrink-0">
          <p class="text-[9px] text-slate-500 font-medium hidden sm:block">
            <i class="fas fa-info-circle mr-0.5"></i> Los campos con <span class="text-rose-500 font-bold">*</span> son obligatorios
          </p>
          <button type="button" (click)="enviar()"
                  class="w-full sm:w-auto px-6 py-1.5 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-700 hover:to-indigo-600 active:scale-[0.98] text-white text-[11px] font-extrabold rounded shadow-md shadow-indigo-200/50 hover:shadow-lg transition-all uppercase tracking-wider flex items-center justify-center gap-2">
            <i class="fas fa-paper-plane text-[10px]"></i>
            Enviar Reporte
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
