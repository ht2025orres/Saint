<div class="fixed inset-0 z-[1200] bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 md:p-4 animate-in fade-in"
     *ngIf="isOpen">
  <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full p-5 md:p-6 space-y-4 animate-in zoom-in-95">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-base shadow-2xs font-black">
          <i class="bi bi-gear-fill"></i>
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-900">
            {{ isEditing ? 'Editar Máquina de Confección' : 'Registrar Máquina de Confección' }}
          </h3>
          <p class="text-[10px] text-slate-400 font-medium">Parque de maquinaria para cálculo de operaciones SAM</p>
        </div>
      </div>
      <button (click)="onClose()" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition cursor-pointer">
        <i class="bi bi-x-lg text-xs"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="space-y-3">
      <!-- Nombre de la Máquina -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Nombre de la Máquina *</label>
        <input 
          type="text" 
          [(ngModel)]="machineForm.name" 
          placeholder="ej. PLANA, FILETEADORA, DOS AGUJAS..." 
          class="w-full px-3 py-1.5 text-xs font-bold bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Código de Maquinaria -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Código de Maquinaria *</label>
        <input 
          type="text" 
          [(ngModel)]="machineForm.code" 
          placeholder="ej. MAQ_PLANA, MAQ_FILET..." 
          class="w-full px-3 py-1.5 text-xs font-mono font-bold bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Descripción -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Descripción / Especificación</label>
        <textarea 
          [(ngModel)]="machineForm.description" 
          rows="2" 
          placeholder="Detalles sobre las características técnicas..." 
          class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
      <button (click)="onClose()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer">
        Cancelar
      </button>
      <button (click)="onSave()" 
              [disabled]="!machineForm.name"
              class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl text-xs font-black shadow-xs transition cursor-pointer">
        {{ isEditing ? 'Guardar Cambios' : 'Registrar Máquina' }}
      </button>
    </div>

  </div>
</div>
