<div class="fixed inset-0 z-[1200] bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 md:p-4 animate-in fade-in"
     *ngIf="isOpen">
  <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full p-5 md:p-6 space-y-4 animate-in zoom-in-95">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-base shadow-2xs"
             [style.backgroundColor]="regionForm.color || '#3b82f6'">
          <i class="bi" [ngClass]="regionForm.icon || 'bi-bounding-box-circles'"></i>
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-900">
            {{ isEditing ? 'Editar Zona Anatómica' : 'Nueva Zona Anatómica' }}
          </h3>
          <p class="text-[10px] text-slate-400 font-medium">Define una región corporal para clasificar partes</p>
        </div>
      </div>
      <button (click)="onClose()" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition cursor-pointer">
        <i class="bi bi-x-lg text-xs"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="space-y-3">

      <!-- Live Preview Card -->
      <div class="bg-gradient-to-r from-slate-50 to-slate-100/50 p-3 rounded-xl border border-slate-200/80 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white text-lg shadow-sm transition-all"
             [style.backgroundColor]="regionForm.color || '#3b82f6'">
          <i class="bi" [ngClass]="regionForm.icon || 'bi-bounding-box-circles'"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-black text-slate-900 truncate">{{ regionForm.label || 'Nueva Región' }}</div>
          <div class="text-[10px] font-mono text-slate-400 font-bold truncate">{{ regionForm.value || 'slug_autogenerado' }}</div>
        </div>
      </div>

      <!-- Nombre Visible (PRIMERO, ya que genera el identificador) -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Nombre Visible *</label>
        <input 
          type="text" 
          [(ngModel)]="regionForm.label" 
          (input)="onLabelInput()"
          placeholder="ej. Hombros y Canesú..." 
          class="w-full px-3 py-2 text-xs font-bold bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all shadow-2xs"
        />
      </div>

      <!-- Identificador / Clave (Auto-generado) -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
          Identificador / Clave
          <span class="text-[9px] font-bold text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded-md normal-case tracking-normal">
            <i class="bi bi-lightning-charge-fill text-amber-500"></i> Auto
          </span>
        </label>
        <input 
          type="text" 
          [value]="regionForm.value" 
          readonly
          placeholder="Se genera al escribir el nombre..." 
          class="w-full px-3 py-2 text-xs font-mono font-bold bg-slate-100 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed shadow-2xs"
        />
      </div>

      <!-- Color Identificativo -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Color Identificativo</label>
        <div class="flex items-center gap-1.5 flex-wrap">
          <button 
            type="button" 
            *ngFor="let c of colorOptions" 
            (click)="regionForm.color = c"
            class="w-7 h-7 rounded-lg transition-all hover:scale-110 cursor-pointer shadow-2xs border-2"
            [style.backgroundColor]="c"
            [ngClass]="regionForm.color === c ? 'border-slate-900 scale-110' : 'border-transparent'">
          </button>
        </div>
      </div>

      <!-- Icono -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Icono</label>
        <div class="flex items-center gap-1.5 flex-wrap">
          <button 
            type="button" 
            *ngFor="let ic of iconOptions" 
            (click)="regionForm.icon = ic"
            class="w-8 h-8 rounded-lg border text-sm flex items-center justify-center transition-all hover:bg-indigo-50 cursor-pointer"
            [ngClass]="regionForm.icon === ic ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm scale-110' : 'bg-slate-50 text-slate-700 border-slate-200'">
            <i class="bi" [ngClass]="ic"></i>
          </button>
        </div>
      </div>

      <!-- Descripción -->
      <div class="space-y-1">
        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-500">Descripción</label>
        <textarea 
          [(ngModel)]="regionForm.description" 
          rows="2" 
          placeholder="Breve detalle de qué componentes comprende..."
          class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 resize-none transition-all shadow-2xs"></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
      <button (click)="onClose()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition cursor-pointer">
        Cancelar
      </button>
      <button (click)="onSave()" 
              [disabled]="!regionForm.label"
              class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl text-xs font-black shadow-xs transition cursor-pointer">
        {{ isEditing ? 'Guardar Cambios' : 'Crear Zona' }}
      </button>
    </div>

  </div>
</div>
