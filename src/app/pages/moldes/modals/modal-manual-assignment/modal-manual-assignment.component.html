<div class="fixed inset-0 z-[1100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in" (click)="onCancel()">
  <div class="w-full max-w-[450px] bg-white rounded-[32px] shadow-2xl overflow-hidden animate-in zoom-in-95" (click)="$event.stopPropagation()">
    <div class="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
      <h2 class="text-lg font-extrabold text-slate-900 uppercase tracking-tight">Asignación Manual</h2>
      <button class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-white" (click)="onCancel()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="p-8 space-y-4">
      <div class="flex flex-col gap-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Descripción del Material</label>
        <textarea [(ngModel)]="manualText" placeholder="Escribe el nombre del material..." 
                  class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:bg-white outline-none transition-all resize-none" rows="4"></textarea>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Color (opcional)</label>
        <input type="text" [(ngModel)]="manualColor" placeholder="Ej: Azul Rey" 
               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:bg-white outline-none transition-all" />
      </div>
    </div>
    <div class="p-6 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
      <button class="px-6 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-500 font-bold hover:bg-slate-100 transition-all" (click)="onCancel()">Cancelar</button>
      <button class="px-8 py-2.5 rounded-xl bg-indigo-600 text-white font-bold shadow-lg transition-all" (click)="onConfirm()" [disabled]="!manualText.trim()">Asignar</button>
    </div>
  </div>
</div>
