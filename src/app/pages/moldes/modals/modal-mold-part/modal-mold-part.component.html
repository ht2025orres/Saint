<div class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in" (click)="onCancel()">
  <div class="w-full max-w-[400px] bg-white rounded-[32px] p-8 shadow-2xl animate-in zoom-in-95" (click)="$event.stopPropagation()">
    <h3 class="text-xl font-extrabold text-slate-900 mb-6 flex items-center gap-3">
      <i class="bi" [ngClass]="isNew ? (pendingPin ? 'bi-pin-angle' : 'bi-plus-circle') : 'bi-pencil-square text-indigo-600'"></i>
      {{ isNew ? (pendingPin ? 'Nuevo Componente de Diseño' : 'Nuevo Componente General') : 'Editar Componente' }}
    </h3>
    
    <div class="space-y-6" *ngIf="part">
      <!-- Nombre del Componente -->
      <div class="flex flex-col gap-2 relative">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nombre del Componente</label>
        <div class="relative">
          <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" [(ngModel)]="searchQuery" (focus)="showSuggestions = true"
                 placeholder="Ej: Hilo, Cremallera..." 
                 class="w-full pl-10 pr-5 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 font-bold focus:bg-white focus:border-indigo-500 outline-none transition-all" 
                 (keyup.enter)="onSave()" />
        </div>

        <!-- Sugerencias -->
        <div class="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[1100] animate-in slide-in-from-top-2" 
             *ngIf="showSuggestions && filteredSuggestions.length > 0">
          <div class="p-2 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
            <span class="text-[8px] font-black text-slate-400 uppercase px-2">Sugerencias de Componentes</span>
            <button (click)="showSuggestions = false"><i class="bi bi-x text-slate-400"></i></button>
          </div>
          <div class="max-h-48 overflow-y-auto custom-scrollbar">
            <div *ngFor="let s of filteredSuggestions" (click)="selectSuggestion(s)"
                 class="px-4 py-3 text-xs font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 cursor-pointer border-b border-slate-50 last:border-0 transition-all flex items-center justify-between">
              <div class="flex flex-col">
                <span class="block">{{ s.display_name || s.name }}</span>
                <span class="text-[8px] text-slate-400 uppercase tracking-tighter">{{ s.item_type || 'parte' }}</span>
              </div>
              <i class="bi bi-plus-circle text-indigo-300"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Tipo de Componente -->
      <div class="flex flex-col gap-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tipo de Componente</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="parte" class="hidden" />
            <div [ngClass]="part.item_type === 'parte' ? 'border-amber-500 bg-amber-50 text-amber-600' : 'border-slate-100 bg-slate-50 text-slate-400'" class="p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all">
              <i class="bi bi-layers text-lg"></i><span class="text-[8px] font-black uppercase">Parte</span>
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="insumo" class="hidden" />
            <div [ngClass]="part.item_type === 'insumo' ? 'border-indigo-500 bg-indigo-50 text-indigo-600' : 'border-slate-100 bg-slate-50 text-slate-400'" class="p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all">
              <i class="bi bi-box-seam text-lg"></i><span class="text-[8px] font-black uppercase">Insumo</span>
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="tela" class="hidden" />
            <div [ngClass]="part.item_type === 'tela' ? 'border-indigo-500 bg-indigo-50 text-indigo-600' : 'border-slate-100 bg-slate-50 text-slate-400'" class="p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all">
              <i class="bi bi-droplet text-lg"></i><span class="text-[8px] font-black uppercase">Tela</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3 mt-8">
        <button (click)="onCancel()" class="px-6 py-2.5 rounded-xl border border-slate-200 text-slate-500 font-black text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-all">
          Cancelar
        </button>
        <button (click)="onSave()" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-black text-[10px] uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">
          {{ isNew ? 'Agregar Componente' : 'Guardar Cambios' }}
        </button>
      </div>
    </div>
  </div>
</div>
