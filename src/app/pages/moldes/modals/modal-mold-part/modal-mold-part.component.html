<div class="fixed inset-0 z-[1100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in" (click)="onCancel()">
  <div class="w-full max-w-[460px] bg-white rounded-[32px] p-6 sm:p-8 shadow-2xl animate-in zoom-in-95 border border-slate-100" (click)="$event.stopPropagation()">
    
    <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-100">
      <h3 class="text-base font-black text-slate-900 flex items-center gap-2.5 uppercase tracking-wide">
        <i class="bi" [ngClass]="isNew ? (pendingPin ? 'bi-pin-angle text-indigo-600' : 'bi-plus-circle text-indigo-600') : 'bi-pencil-square text-indigo-600'"></i>
        <span>{{ isNew ? (pendingPin ? 'Nueva Zona Delimitada' : 'Nuevo Componente General') : 'Editar Zona / Componente' }}</span>
      </h3>
      <button (click)="onCancel()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors">
        <i class="bi bi-x-lg text-xs"></i>
      </button>
    </div>
    
    <div class="space-y-5" *ngIf="part">
      
      <!-- Tipo de Componente Selector -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tipo de Componente</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="parte" class="hidden" />
            <div [ngClass]="part.item_type === 'parte' ? 'border-amber-500 bg-amber-50 text-amber-700 font-black shadow-xs' : 'border-slate-200 bg-slate-50 text-slate-500 font-bold'" 
                 class="p-2.5 rounded-xl border-2 flex flex-col items-center gap-1 transition-all text-center">
              <i class="bi bi-layers text-base"></i>
              <span class="text-[9px] uppercase">Parte Prenda</span>
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="insumo" class="hidden" />
            <div [ngClass]="part.item_type === 'insumo' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 font-black shadow-xs' : 'border-slate-200 bg-slate-50 text-slate-500 font-bold'" 
                 class="p-2.5 rounded-xl border-2 flex flex-col items-center gap-1 transition-all text-center">
              <i class="bi bi-box-seam text-base"></i>
              <span class="text-[9px] uppercase">Insumo</span>
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" [(ngModel)]="part.item_type" value="tela" class="hidden" />
            <div [ngClass]="part.item_type === 'tela' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 font-black shadow-xs' : 'border-slate-200 bg-slate-50 text-slate-500 font-bold'" 
                 class="p-2.5 rounded-xl border-2 flex flex-col items-center gap-1 transition-all text-center">
              <i class="bi bi-droplet text-base"></i>
              <span class="text-[9px] uppercase">Tela</span>
            </div>
          </label>
        </div>
      </div>

      <!-- SECCIÓN SI ES PARTE: Catálogo Global + Variante -->
      <div *ngIf="part.item_type === 'parte'" class="space-y-3 bg-amber-50/50 p-4 rounded-2xl border border-amber-200/70">
        <div>
          <label class="block text-[10px] font-black text-amber-900 uppercase tracking-widest mb-1">1. Parte de Vestuario (Catálogo Global)</label>
          <select [(ngModel)]="selectedGarmentPartId" (change)="onGarmentPartChange()"
                  class="w-full px-3 py-2 bg-white border border-amber-300 rounded-xl text-xs font-bold text-slate-800 focus:border-amber-500 outline-none transition-all cursor-pointer">
            <option [ngValue]="null" disabled selected>-- Elegir Parte del Catálogo --</option>
            <option *ngFor="let gp of globalGarmentPartsCatalog" [ngValue]="gp.id">
              {{ gp.name }} ({{ gp.types?.length || 0 }} variantes)
            </option>
          </select>
        </div>

        <div *ngIf="availablePartTypes.length > 0">
          <label class="block text-[10px] font-black text-indigo-900 uppercase tracking-widest mb-1">2. Variante / Confección por Defecto</label>
          <select [(ngModel)]="selectedGarmentPartTypeId" (change)="onVariantChange()"
                  class="w-full px-3 py-2 bg-indigo-50/80 border border-indigo-200 rounded-xl text-xs font-bold text-indigo-900 focus:border-indigo-500 outline-none transition-all cursor-pointer">
            <option *ngFor="let t of availablePartTypes" [ngValue]="t.id">
              {{ t.name }} ({{ t.total_time | number:'1.2-2' }} min SAM)
            </option>
          </select>
        </div>
      </div>

      <!-- SECCIÓN SI ES INSUMO O TELA: Input libre con sugerencias -->
      <div *ngIf="part.item_type !== 'parte'" class="flex flex-col gap-1.5 relative">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nombre del Material / Insumo</label>
        <div class="relative">
          <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" [(ngModel)]="searchQuery" (focus)="showSuggestions = true"
                 placeholder="Ej: Hilo Poliéster, Botón 4 huecos..." 
                 class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:border-indigo-500 outline-none transition-all" 
                 (keyup.enter)="onSave()" />
        </div>

        <!-- Sugerencias -->
        <div class="absolute top-full left-0 right-0 mt-1 bg-white rounded-xl shadow-2xl border border-slate-100 overflow-hidden z-[1100]" 
             *ngIf="showSuggestions && filteredSuggestions.length > 0">
          <div class="p-2 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
            <span class="text-[8px] font-black text-slate-400 uppercase px-2">Sugerencias</span>
            <button (click)="showSuggestions = false"><i class="bi bi-x text-slate-400"></i></button>
          </div>
          <div class="max-h-40 overflow-y-auto custom-scrollbar">
            <div *ngFor="let s of filteredSuggestions" (click)="selectSuggestion(s)"
                 class="px-3 py-2 text-xs font-bold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 cursor-pointer border-b border-slate-50 last:border-0 transition-all flex items-center justify-between">
              <span>{{ s.display_name || s.name }}</span>
              <span class="text-[8px] text-slate-400 uppercase">{{ s.item_type || 'insumo' }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Dimensiones de la Zona (Width & Height) si está posicionada -->
      <div *ngIf="part.position_x !== null" class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
        <div>
          <label class="block text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1">Ancho Recuadro (%)</label>
          <input type="number" min="5" max="90" [(ngModel)]="part.width"
                 class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-800 outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1">Alto Recuadro (%)</label>
          <input type="number" min="5" max="90" [(ngModel)]="part.height"
                 class="w-full px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-800 outline-none focus:border-indigo-500" />
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-100">
        <button (click)="onCancel()" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold text-xs hover:bg-slate-100 transition-all">
          Cancelar
        </button>
        <button (click)="onSave()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-black text-xs hover:bg-indigo-700 transition-all shadow-md shadow-indigo-500/20">
          {{ isNew ? 'Agregar a Molde' : 'Guardar Zona' }}
        </button>
      </div>

    </div>
  </div>
</div>
