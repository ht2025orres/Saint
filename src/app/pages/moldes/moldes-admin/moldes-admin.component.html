<div class="h-screen bg-slate-50 font-inter flex flex-col overflow-hidden">
  <!-- Topbar Unificada (Header + Pestañas + Resumen + Acciones) -->
  <div class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-[60] shadow-2xs shrink-0">
    
    <!-- IZQUIERDA: Botón Volver + Título + Nombre del Molde -->
    <div class="flex items-center gap-3 min-w-0">
      <button type="button" 
              class="w-9 h-9 flex items-center justify-center bg-slate-100 rounded-xl text-slate-500 hover:bg-indigo-600 hover:text-white transition-all shrink-0 cursor-pointer" 
              (click)="goBack()" title="Volver a la lista de moldes">
        <i class="bi bi-arrow-left text-base"></i>
      </button>
      <div class="min-w-0">
        <h1 class="text-base font-black text-slate-900 flex items-center gap-2 truncate leading-tight">
          <i class="bi" [ngClass]="isReadOnly ? 'bi-eye text-amber-600' : 'bi-vector-pen text-indigo-600'"></i>
          <span>{{ isReadOnly ? 'Ver Molde' : (isEditMode ? 'Editar Molde' : 'Nuevo Molde') }}</span>
          <span *ngIf="isReadOnly" class="px-2 py-0.5 bg-amber-100 text-amber-800 text-[9px] font-black rounded-lg uppercase tracking-wider">Solo Lectura</span>
        </h1>
        <p class="text-[11px] font-bold text-indigo-600 truncate" *ngIf="moldName">{{ moldName }}</p>
        <p class="text-[11px] font-medium text-slate-400 italic truncate" *ngIf="!moldName">Sin nombre asignado</p>
      </div>
    </div>

    <!-- CENTRO: Pestañas de Navegación + Resumen en Badges -->
    <div class="flex items-center gap-3 flex-wrap">
      <!-- Selector de Pestaña -->
      <div class="flex bg-slate-100/90 p-1 rounded-xl border border-slate-200">
        <button type="button" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"
                [ngClass]="activeTab === 'molde' ? 'bg-white text-indigo-600 shadow-xs font-black' : 'text-slate-500 hover:text-slate-800'"
                (click)="activeTab = 'molde'">
          <i class="bi bi-palette-fill"></i>
          <span>Diseño (Figurín)</span>
        </button>
        <button type="button" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"
                [ngClass]="activeTab === 'formulario' ? 'bg-white text-indigo-600 shadow-xs font-black' : 'text-slate-500 hover:text-slate-800'"
                (click)="activeTab = 'formulario'">
          <i class="bi bi-diagram-3-fill"></i>
          <span>Estructura y Materiales</span>
        </button>
      </div>

      <!-- Resumen Compacto Integrado -->
      <div class="hidden lg:flex items-center gap-1.5 bg-slate-50 p-1 rounded-xl border border-slate-200 text-xs">
        <span class="px-2.5 py-1 bg-white text-indigo-700 border border-indigo-100 rounded-lg text-[11px] font-extrabold flex items-center gap-1 shadow-2xs">
          <i class="bi bi-vector-pen text-indigo-500"></i> {{ uniqueLogicalZonesCount }} {{ uniqueLogicalZonesCount === 1 ? 'Zona' : 'Zonas' }}
        </span>
        <span class="px-2.5 py-1 bg-white text-amber-700 border border-amber-100 rounded-lg text-[11px] font-extrabold flex items-center gap-1 shadow-2xs">
          <i class="bi bi-puzzle text-amber-500"></i> {{ parts.length }} Partes
        </span>
      </div>
    </div>

    <!-- DERECHA: Botones de Acción Instantáneos (Guardar / Cancelar) -->
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" 
              class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"
              *ngIf="isReadOnly && canEdit" (click)="switchToEditMode()">
        <i class="bi bi-pencil-square"></i>
        <span>Cambiar a Editar</span>
      </button>

      <button type="button" 
              class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-all cursor-pointer" 
              (click)="goBack()">
        {{ isReadOnly ? 'VOLVER' : 'CANCELAR' }}
      </button>

      <button type="button" 
              class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-black shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/30 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" 
              *ngIf="!isReadOnly"
              (click)="saveMold()" 
              [disabled]="saving || !moldName.trim()">
        <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin" *ngIf="saving"></span>
        <i class="bi bi-check2-circle text-sm" *ngIf="!saving"></i>
        <span>{{ saving ? 'GUARDANDO...' : 'GUARDAR CAMBIOS' }}</span>
      </button>
    </div>

  </div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
      
      <!-- ═══ TAB 1: MOLDE (DISEÑO) ═══ -->
      <app-admin-tab-diseno
        *ngIf="activeTab === 'molde'"
        [moldName]="moldName"
        [moldDescription]="moldDescription"
        [mold_category_id]="mold_category_id"
        [moldCategories]="moldCategories"
        [isReadOnly]="isReadOnly"
        [canEdit]="canEdit"
        [canUploadImage]="canUploadImage"
        [customImageUrl]="activeImage"
        [imageLoadError]="imageLoadError"
        [isDraggingGarment]="isDraggingGarment"
        [activeZones]="activeZones"
        [sortedActiveZones]="sortedActiveZones"
        [selectedZoneForParts]="selectedZoneForParts"
        [activeParts]="activeParts"
        [allZones]="zones"
        [allParts]="parts"
        [isDrawingZone]="isDrawingZone"
        [drawingZonePoints]="drawingZonePoints"
        [drawingCurrentMousePos]="drawingCurrentMousePos"
        [awaitingPosition]="awaitingPosition"
        [zoneTypeOptions]="zoneTypeOptions"
        [editingZoneIndex]="editingZoneIndex"
        [editingZone]="editingZoneIndex !== null ? zones[editingZoneIndex] : null"
        [activeView]="activeView"
        [hasBackView]="hasBackView"
        (toggleView)="toggleActiveView()"
        (moldNameChange)="moldName = $event; saveDraft()"
        (moldDescriptionChange)="moldDescription = $event; saveDraft()"
        (moldCategoryIdChange)="mold_category_id = $event; saveDraft()"
        (manageCategories)="showCategoryManager = true"
        (toggleDrawMode)="toggleZoneDrawMode($event)"
        (undoPoint)="undoLastPoint()"
        (finishShape)="finishDrawingZone()"
        (openZoneDrawer)="openZonePartsDrawer($event)"
        (editZone)="startEditZone($event)"
        (deleteZone)="removeZone(zones.indexOf($event))"
        (selectZoneForVertexEdit)="startVertexEdit($event)"
        (pointsChange)="drawingZonePoints = $event"
        (canvasClick)="onCanvasClick($event)"
        (canvasMouseMove)="onZoneCanvasMouseMove($event)"
        (canvasDblClick)="onZoneCanvasDblClick($event)"
        (startPointClick)="onStartPointClick($event.event, $event.index)"
        (customImageUpload)="onCustomImageUpload($event)"
        (garmentDragOver)="onGarmentDragOver($event)"
        (garmentDragLeave)="onGarmentDragLeave($event)"
        (garmentDrop)="onGarmentDrop($event)"
        (imageError)="onImageError()">
      </app-admin-tab-diseno>

      <!-- ═══ TAB 2: FORMULARIO (ESTRUCTURA Y MATERIALES) ═══ -->
      <app-admin-tab-estructura
        *ngIf="activeTab === 'formulario'"
        [moldName]="moldName"
        [moldDescription]="moldDescription"
        [mold_category_id]="mold_category_id"
        [moldCategories]="moldCategories"
        [isReadOnly]="isReadOnly"
        [structuralParts]="structuralParts"
        [allMoldParts]="parts"
        (moldNameChange)="moldName = $event; saveDraft()"
        (moldDescriptionChange)="moldDescription = $event; saveDraft()"
        (moldCategoryIdChange)="mold_category_id = $event; saveDraft()">
      </app-admin-tab-estructura>

    </div>
  </div>
</div>

<!-- ═══ MODALES EXTERNOS Y REFACTORIZADOS ═══ -->

<!-- Modal: Editar Parte / Material -->
<app-modal-mold-part
  *ngIf="showEditModal"
  [part]="editingPart"
  [isNew]="isNewPart"
  [availableComponents]="availableComponents"
  [isReadOnly]="isReadOnly"
  [activeTab]="activeTab"
  [pendingPin]="pendingPin"
  (save)="savePart()"
  (cancel)="cancelEdit()">
</app-modal-mold-part>

<!-- Modal: Agregar Componente General -->
<app-modal-add-part
  *ngIf="showAddModal && activeTab !== 'molde'"
  [type]="'general'"
  [availableComponents]="availableComponents"
  (confirm)="confirmAddModal($event)"
  (cancel)="showAddModal = false">
</app-modal-add-part>

<!-- Modal: Búsqueda de Inventario -->
<app-inventory-search-modal
  *ngIf="showInventorySearch"
  [filterType]="inventorySearchFilterType"
  [partName]="editingPart ? editingPart.name : ''"
  (onClose)="showInventorySearch = false"
  (onSelect)="handleInventorySelect($event)">
</app-inventory-search-modal>

<!-- Modal: Gestión de Categorías de Molde -->
<app-modal-category-manager
  *ngIf="showCategoryManager"
  (onClose)="showCategoryManager = false; loadMoldCategories()"
  (onCategoriesChanged)="loadMoldCategories()">
</app-modal-category-manager>

<!-- Modal: Asignar / Editar Región Anatómica a Zona Trazada -->
<app-modal-zone-selector
  [isOpen]="showZoneNameModal"
  [isEdit]="editingZoneIndex !== null"
  [pendingZoneType]="pendingZoneType"
  [zoneTypeOptions]="zoneTypeOptions"
  (selectZoneType)="selectZoneTypeAndConfirm($event)"
  (confirm)="editingZoneIndex !== null ? confirmZoneEdit() : confirmZoneCreation()"
  (cancel)="cancelZoneCreation()">
</app-modal-zone-selector>

<!-- Modal: Cajón de Gestión de Partes Maestras, Variantes y SAM por Zona -->
<app-modal-zone-parts-drawer
  [isOpen]="showZonePartsDrawer && !!selectedZoneForParts"
  [zone]="selectedZoneForParts"
  [isReadOnly]="isReadOnly"
  [loadingZoneCatalog]="loadingZoneCatalog"
  [zoneCatalogParts]="zoneCatalogParts"
  [zoneTypeOptions]="zoneTypeOptions"
  [parts]="parts"
  (closeDrawer)="closeZonePartsDrawer()"
  (editZone)="startEditZone($event)"
  (togglePart)="toggleZonePart($event)"
  (setMandatory)="setPartMandatory($event.part, $event.isMandatory)"
  (toggleVariant)="togglePartVariant($event.part, $event.typeId)">
</app-modal-zone-parts-drawer>
