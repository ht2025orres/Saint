<div id="main-wrapper" class="topbar-layout" [class.has-testing-banner]="isTesting">

  <app-header></app-header>

  <!-- Banner Universal de Ambiente de Pruebas -->
  <aside *ngIf="isTesting" 
         class="testing-banner"
         role="alert"
         aria-label="Aviso de entorno de pruebas">
    
    <!-- Vista Completa -->
    <div class="testing-banner-inner" *ngIf="!isBannerMinimized">
      <div class="testing-banner-content">
        <span class="testing-badge">
          <i class="bi bi-cone-striped"></i> ENTORNO DE PRUEBAS
        </span>
        <span class="testing-message">
          ⚠️ <strong>Atención:</strong> Esta es una <u>versión preliminar de pruebas</u> antes de su despliegue en producción. Los datos pueden eliminarse o resetearse sin previo aviso.
        </span>
      </div>
      
      <button type="button" 
              (click)="toggleBanner()" 
              class="testing-toggle-btn"
              title="Minimizar aviso">
        <i class="bi bi-chevron-up"></i> Minimizar
      </button>
    </div>

    <!-- Vista Minimizada -->
    <div class="testing-banner-inner" *ngIf="isBannerMinimized">
      <div class="testing-banner-content">
        <span class="testing-badge">
          <i class="bi bi-cone-striped"></i> PRUEBAS
        </span>
        <span class="testing-message-mini">
          Versión preliminar no productiva
        </span>
      </div>
      
      <button type="button" 
              (click)="toggleBanner()" 
              class="testing-toggle-btn"
              title="Expandir aviso completo">
        <i class="bi bi-chevron-down"></i> Ver más
      </button>
    </div>

  </aside>

  <!-- Banner de Personificación (en caso de estar activo) -->
  <div *ngIf="authService.isImpersonating" 
       class="impersonation-banner d-flex align-items-center justify-content-center p-2 bg-warning text-dark font-weight-bold">
    <i class="fa fa-user-secret mr-2"></i>
    <span>Estás actuando como: <strong>{{ authService.user.firstName }} {{ authService.user.lastName }}</strong></span>
    <button class="btn btn-sm btn-dark ml-3" (click)="stopImpersonating()">
      <i class="fa fa-sign-out mr-1"></i> Salir de personificación
    </button>
  </div>

  <!-- Sidebar Component (Drawer responsivo para móviles) -->
  <app-sidebar></app-sidebar>

  <div class="page-wrapper full-width-wrapper">
    <div class="container-fluid px-3 px-md-4 py-3">

      <!--Mi sistema de rutas-->
      <router-outlet></router-outlet>

    </div>

    <!-- footer -->
    <app-footer></app-footer>
  </div>

</div>

<app-task-panel></app-task-panel>
