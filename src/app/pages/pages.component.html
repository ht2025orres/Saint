<div id="main-wrapper" class="topbar-layout">

  <app-header></app-header>

  <!-- Banner de Personificación (en caso de estar activo) -->
  <div *ngIf="authService.isImpersonating" 
       class="impersonation-banner d-flex align-items-center justify-content-center p-2 bg-warning text-dark font-weight-bold">
    <i class="fa fa-user-secret mr-2"></i>
    <span>Estás actuando como: <strong>{{ authService.user.firstName }} {{ authService.user.lastName }}</strong></span>
    <button class="btn btn-sm btn-dark ml-3" (click)="stopImpersonating()">
      <i class="fa fa-sign-out mr-1"></i> Salir de personificación
    </button>
  </div>

  <!-- Sidebar Component (Drawer responsivo para móviles) -->
  <app-sidebar></app-sidebar>

  <div class="page-wrapper full-width-wrapper">
    <div class="container-fluid px-3 px-md-4 py-3">

      <!--Mi sistema de rutas-->
      <router-outlet></router-outlet>

    </div>

    <!-- footer -->
    <app-footer></app-footer>
  </div>

</div>

<app-task-panel></app-task-panel>
