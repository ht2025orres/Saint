<!-- ──────── MODAL: Proyecto ──────── -->
<div *ngIf="showModalProyecto" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center"><i
                        class="bi bi-kanban text-blue-600"></i></div>
                <h2 class="text-base font-bold text-gray-900">{{ modalProyectoTitle }}</h2>
            </div>
            <button (click)="onCerrarModalProyecto.emit()"
                class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition"><i
                    class="bi bi-x-lg"></i></button>
        </div>
        <div class="px-6 py-5 overflow-y-auto" style="max-height: 75vh;">
            <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1.5">Título <span
                        class="text-red-500">*</span></label><input type="text" [(ngModel)]="proyectoForm.titulo"
                    placeholder="Nombre descriptivo del proyecto"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>
            <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1.5">Descripción</label><textarea
                    [(ngModel)]="proyectoForm.descripcion" rows="3"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition resize-none"></textarea>
            </div>
            <div class="mb-4" *ngIf="!selectedProyecto || (selectedProyecto && puedeCambiarFechas(selectedProyecto))">
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Fecha límite de entrega</label><input
                    type="datetime-local" [(ngModel)]="proyectoForm.fecha_limite_entrega"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div *ngIf="selectedProyecto" class="mb-4"><label
                    class="block text-sm font-medium text-gray-700 mb-1.5">Estado</label><select
                    [(ngModel)]="proyectoForm.estado"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <option value="pendiente">Pendiente</option>
                    <option value="en_ejecucion">En Ejecución</option>
                    <option value="completado">Completado</option>
                    <option value="pausado">Pausado</option>
                    <option value="cancelado">Cancelado</option>
                </select></div>
        </div>
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-2">
            <button (click)="onCerrarModalProyecto.emit()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancelar</button>
            <button (click)="onGuardarProyecto.emit()"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition"><i
                    class="bi bi-check-lg mr-1"></i>Guardar</button>
        </div>
    </div>
</div>
