<div *ngIf="showModalPermisos" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden">
        <!-- cabecera -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center"><i
                        class="bi bi-shield-lock text-purple-600"></i></div>
                <div>
                    <h2 class="text-base font-bold text-gray-900">Permisos del {{ permisosEntidad?.tipo }}</h2>
                    <p class="text-xs text-gray-500">Los Integrantes sin permiso asignado solo pueden visualizar y
                        completar tareas.</p>
                </div>
            </div>
            <button (click)="onCerrarModalPermisos.emit()"
                class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition"><i
                    class="bi bi-x-lg"></i></button>
        </div>

        <div class="px-6 py-5 overflow-y-auto" style="max-height: 75vh;">
            <!-- ... (Contenido similar al original) ... -->
        </div>

        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-2">
            <button (click)="onCerrarModalPermisos.emit()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancelar</button>
            <button (click)="onGuardarPermisos.emit()"
                class="px-4 py-2 text-sm font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700 transition">
                <i class="bi bi-shield-check mr-1"></i>Guardar permisos
            </button>
        </div>
    </div>
</div>
