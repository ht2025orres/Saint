<div *ngIf="showModalFlujo" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-lg overflow-hidden rounded-2xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-emerald-100 bg-emerald-50/70 px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-100 text-emerald-700">
          <i class="bi bi-lightning-charge-fill"></i>
        </div>
        <div>
          <h2 class="text-base font-semibold text-gray-900">Nuevo flujo diario</h2>
          <p class="text-xs text-gray-500">Define el bloque de trabajo que se va a seguir en la jornada.</p>
        </div>
      </div>
      <button (click)="cerrarModalFlujo.emit()" class="rounded-lg p-1.5 text-gray-400 transition hover:bg-white hover:text-gray-700">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="space-y-4 px-6 py-5">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Título</label>
        <input [(ngModel)]="flujoForm.titulo" type="text" placeholder="Ej. Compromisos del día"
          class="w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100">
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Fecha</label>
        <input [(ngModel)]="flujoForm.fecha" type="date"
          class="w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100">
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t border-gray-100 bg-gray-50 px-6 py-4">
      <button (click)="cerrarModalFlujo.emit()" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100">
        Cancelar
      </button>
      <button (click)="guardarFlujo.emit()" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-700">
        Crear flujo
      </button>
    </div>
  </div>
</div>

<div *ngIf="showModalCompromiso" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-2xl overflow-hidden rounded-2xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-indigo-100 bg-indigo-50/70 px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-100 text-indigo-700">
          <i class="bi bi-list-check"></i>
        </div>
        <div>
          <h2 class="text-base font-semibold text-gray-900">{{ compromisoModalTitle }}</h2>
          <p class="text-xs text-gray-500">Asigna responsables y deja clara la meta del compromiso.</p>
        </div>
      </div>
      <button (click)="cerrarModalCompromiso.emit()" class="rounded-lg p-1.5 text-gray-400 transition hover:bg-white hover:text-gray-700">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="grid gap-5 px-6 py-5 lg:grid-cols-[minmax(0,1fr)_280px]">
      <div class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Título</label>
          <input [(ngModel)]="compromisoForm.titulo" type="text" placeholder="Ej. Validar despliegue"
            class="w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Descripción</label>
          <textarea [(ngModel)]="compromisoForm.descripcion" rows="5" placeholder="Contexto, entregable esperado o notas..."
            class="w-full rounded-xl border border-gray-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"></textarea>
        </div>
      </div>

      <div class="rounded-2xl border border-gray-200 bg-gray-50 p-4">
        <div class="mb-3 flex items-center justify-between gap-2">
          <h3 class="text-sm font-semibold text-gray-800">Responsables</h3>
          <span class="rounded-full bg-indigo-100 px-2 py-0.5 text-[11px] font-semibold text-indigo-700">
            {{ compromisoForm.responsables.length }} seleccionados
          </span>
        </div>

        <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
          <button *ngFor="let participante of participantes" type="button"
            (click)="toggleResponsable(participante.id)"
            class="flex w-full items-center gap-3 rounded-xl border px-3 py-2 text-left transition"
            [ngClass]="isResponsableSeleccionado(participante.id)
              ? 'border-indigo-300 bg-white shadow-sm'
              : 'border-transparent bg-white/70 hover:border-gray-200 hover:bg-white'">
            <div class="flex h-9 w-9 items-center justify-center rounded-full text-xs font-bold text-white"
              [ngClass]="colorPorId[participante.id] || 'bg-gray-400'">
              {{ inicialesPorId[participante.id] || '??' }}
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium text-gray-800">{{ participante.nombre }}</p>
              <p class="text-xs text-gray-500">Disponible para el flujo</p>
            </div>
            <div class="flex h-5 w-5 items-center justify-center rounded-full border text-[10px]"
              [ngClass]="isResponsableSeleccionado(participante.id)
                ? 'border-indigo-600 bg-indigo-600 text-white'
                : 'border-gray-300 bg-white text-transparent'">
              <i class="bi bi-check"></i>
            </div>
          </button>
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t border-gray-100 bg-gray-50 px-6 py-4">
      <button (click)="cerrarModalCompromiso.emit()" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100">
        Cancelar
      </button>
      <button (click)="guardarCompromiso.emit()" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700">
        Guardar compromiso
      </button>
    </div>
  </div>
</div>
