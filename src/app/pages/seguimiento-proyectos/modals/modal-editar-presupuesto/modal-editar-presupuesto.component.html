<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden">

    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <h3 class="text-lg font-bold text-slate-800 tracking-tight">
        {{ proyecto ? 'Editar Proyecto Financiero' : 'Registrar Nuevo Proyecto' }}
      </h3>
      <button (click)="onCerrar()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
        <i class="bi bi-x-lg text-lg"></i>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="guardar()" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Código Proyecto -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Código del Proyecto *</label>
          <input type="text" formControlName="codigo_proyecto" placeholder="Ej: PF-TL-OPEMA19"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 disabled:opacity-60" />
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Estado *</label>
          <select formControlName="estado"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Nombre Proyecto -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nombre / Título</label>
          <input type="text" formControlName="nombre_proyecto" placeholder="Descripción breve"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
        </div>

        <!-- Cliente -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Cliente</label>
          <input type="text" formControlName="cliente" placeholder="Nombre cliente"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800
                   focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
        </div>
      </div>

      <!-- Sección Presupuesto -->
      <div class="border-t border-slate-100 pt-4 mt-2">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Valores Presupuestados</h4>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Facturación Presupuestada ($)</label>
            <input type="number" formControlName="facturacion_presupuestada" min="0"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono text-slate-800
                     focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Costo Presupuestado ($)</label>
            <input type="number" formControlName="costo_presupuestado" min="0"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono text-slate-800
                     focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Admin / Mano de Obra ($)</label>
            <input type="number" formControlName="admin_mano_obra_presupuestada" min="0"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono text-slate-800
                     focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Comisión ($)</label>
            <input type="number" formControlName="comision_presupuestada" min="0"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono text-slate-800
                     focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400" />
          </div>
        </div>
      </div>

      <!-- Observaciones -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Observaciones / Notas Siesa</label>
        <textarea formControlName="observaciones" rows="3" placeholder="Notas sobre el estado, suspensiones o detalles contables..."
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800
                 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400"></textarea>
      </div>

      <!-- Footer Action Buttons -->
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex justify-end gap-3 -mx-6 -mb-6 mt-4">
        <button type="button" (click)="onCerrar()"
          class="px-5 py-2.5 rounded-xl text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">
          Cancelar
        </button>
        <button type="submit" [disabled]="saving"
          class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-sm">
          {{ saving ? 'Guardando...' : (proyecto ? 'Guardar Cambios' : 'Registrar Proyecto') }}
        </button>
      </div>
    </form>

  </div>
</div>
