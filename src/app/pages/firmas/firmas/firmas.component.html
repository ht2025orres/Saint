<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom py-3">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold text-primary">Módulo de Firmas Digitales</h4>
            <div class="btn-group" role="group">
              <button *ngFor="let t of tabs" 
                      type="button" 
                      class="btn px-4"
                      [class.btn-primary]="vista === t.id"
                      [class.btn-outline-primary]="vista !== t.id"
                      (click)="cambiarVista(t.id)">
                <i class="bi {{t.icon}} me-2"></i> {{t.label}}
              </button>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <!-- Vistas -->
          <div [ngSwitch]="vista">
            <app-firmas-lista *ngSwitchCase="'lista'"></app-firmas-lista>
            <app-firmas-subir *ngSwitchCase="'subir'" (completado)="cambiarVista('lista')"></app-firmas-subir>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
