<!-- Page Header -->
<header class="saint-page-header">
  <div class="saint-page-header__left">
    <h1 class="saint-page-title">{{title}}</h1>
    <nav aria-label="Navegación de ruta">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/dashboard">Inicio</a></li>
        <li class="breadcrumb-item"><span>Administración</span></li>
        <li class="breadcrumb-item active" aria-current="page">{{title}}</li>
      </ol>
    </nav>
  </div>
  <div class="saint-page-header__actions">
    <button class="btn saint-btn-primary" [routerLink]="['/createUser', 'nuevo']">
      <i class="bi bi-plus-lg"></i>
      Crear Usuario
    </button>
  </div>
</header>

<!-- Main Content -->
<section class="saint-card">

  <!-- Toolbar -->
  <div class="saint-toolbar">
    <div class="saint-toolbar__search">
      <i class="bi bi-search"></i>
      <input type="search" placeholder="Buscar usuarios..." aria-label="Buscar usuarios"
             (keyup)="searchUser(txtWord.value)" #txtWord>
    </div>
    <div class="saint-toolbar__options">
      <label class="saint-select-label">
        Mostrar
        <select (change)="listBySize(+$event.target.value)">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Table -->
  <div class="saint-table-wrapper">
    <table class="saint-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Email</th>
          <th>Roles</th>
          <th class="text-center">Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of listUser">
          <td class="saint-cell-name">{{user.firstName}}</td>
          <td>{{user.lastName}}</td>
          <td class="saint-cell-email">{{user.email}}</td>
          <td>
            <div class="saint-roles-list">
              <span *ngFor="let role of user.roles" class="saint-role-badge"
                    [class.saint-role-badge--admin]="role.id==1">
                {{role.name}}
              </span>
            </div>
          </td>
          <td class="text-center">
            <span class="saint-status-dot" [class.saint-status-dot--active]="user.enabled"
                  [class.saint-status-dot--inactive]="!user.enabled">
              {{user.enabled ? 'Activo' : 'Inactivo'}}
            </span>
          </td>
          <td>
            <div class="saint-actions">
              <!-- Personificar -->
              <button *ngIf="authService.hasPermission(1) && user.id !== authService.user.id"
                      class="saint-action-btn saint-action-btn--impersonate"
                      (click)="impersonate(user)" title="Personificar usuario">
                <i class="bi bi-incognito"></i>
              </button>
              <!-- Editar -->
              <a class="saint-action-btn saint-action-btn--edit"
                 [routerLink]="['/createUser', user.id]" title="Editar usuario">
                <i class="bi bi-pencil"></i>
              </a>
              <!-- Deshabilitar -->
              <button *ngIf="user.enabled"
                      class="saint-action-btn saint-action-btn--disable"
                      (click)="disableUser(user)" title="Deshabilitar usuario">
                <i class="bi bi-person-slash"></i>
              </button>
              <!-- Habilitar -->
              <button *ngIf="!user.enabled"
                      class="saint-action-btn saint-action-btn--enable"
                      (click)="enableUser(user)" title="Habilitar usuario">
                <i class="bi bi-person-check"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginator -->
  <div class="saint-paginator-wrapper">
    <app-shared-paginator *ngIf="paginationService.getPaginatorState(paginatorId)"
      [instanceId]="paginatorId" [showPageSizeSelector]="true" [pageSizeOptions]="[5, 10, 25, 50, 100]"
      [noDataMessage]="'No se encontraron registros'">
    </app-shared-paginator>
  </div>

</section>
