<div *ngIf="show" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" (click)="onCerrar.emit()"></div>
  
  <div class="bg-white rounded-[2.5rem] w-full max-w-lg overflow-hidden shadow-2xl z-10 animate-in zoom-in-95 duration-300">
    <div class="px-8 py-6 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600">
          <i class="bi bi-lightning-charge-fill text-xl"></i>
        </div>
        <div>
          <h3 class="font-black text-gray-900 text-xl leading-tight">{{ compromiso ? 'Editar' : 'Nuevo' }} Compromiso</h3>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mt-0.5">Define una tarea para hoy</p>
        </div>
      </div>
      <button (click)="onCerrar.emit()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-all">
        <i class="bi bi-x-lg text-lg"></i>
      </button>
    </div>

    <form [formGroup]="form" class="p-8 space-y-6">
      <!-- Título -->
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-1">¿Qué se debe hacer?</label>
        <input formControlName="titulo" type="text" placeholder="Ej: Revisar backups del servidor"
          class="w-full px-5 py-4 bg-gray-50 border-2 border-transparent focus:border-emerald-500 focus:bg-white rounded-2xl text-sm font-bold text-gray-700 outline-none transition-all placeholder:text-gray-300">
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-1">Notas adicionales (opcional)</label>
        <textarea formControlName="descripcion" rows="3" placeholder="Detalles sobre el compromiso..."
          class="w-full px-5 py-4 bg-gray-50 border-2 border-transparent focus:border-emerald-500 focus:bg-white rounded-2xl text-sm font-medium text-gray-700 outline-none transition-all resize-none placeholder:text-gray-300"></textarea>
      </div>

      <!-- Responsables -->
      <div>
        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3 ml-1">Responsables (Administradores)</label>
        
        <div class="grid grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
          <div *ngFor="let u of usuarios" 
            (click)="toggleUsuario(u.id)"
            class="flex items-center gap-3 p-3 rounded-2xl border-2 cursor-pointer transition-all group"
            [ngClass]="isUsuarioSeleccionado(u.id) 
              ? 'bg-emerald-50 border-emerald-200' 
              : 'bg-gray-50 border-transparent hover:border-gray-200'">
            
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white text-xs font-black shadow-sm flex-shrink-0 transition-transform group-hover:scale-105"
              [ngClass]="state.getColorPorId(u.id)">
              {{ state.getInicialesResponsable(u.id) }}
            </div>
            
            <div class="min-w-0 flex-1">
              <p class="text-xs font-black truncate transition-colors"
                [ngClass]="isUsuarioSeleccionado(u.id) ? 'text-emerald-700' : 'text-gray-700'">
                {{ u.nombre }}
              </p>
              <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tight">Admin</p>
            </div>

            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all"
              [ngClass]="isUsuarioSeleccionado(u.id) 
                ? 'bg-emerald-500 border-emerald-500 text-white' 
                : 'border-gray-200 group-hover:border-gray-300'">
              <i *ngIf="isUsuarioSeleccionado(u.id)" class="bi bi-check-lg text-[10px]"></i>
            </div>
          </div>
        </div>

        <!-- Validación error -->
        <p *ngIf="form.get('responsables')?.touched && form.get('responsables')?.invalid" 
          class="mt-2 text-[10px] text-rose-500 font-black uppercase tracking-widest ml-1">
          Debes seleccionar al menos un responsable
        </p>
      </div>

      <div class="pt-4 flex items-center gap-3">
        <button type="button" (click)="onCerrar.emit()"
          class="flex-1 px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-500 bg-white border-2 border-gray-100 rounded-2xl hover:bg-gray-50 transition-all">
          Cancelar
        </button>
        <button type="button" (click)="submit()" [disabled]="form.invalid || saving"
          class="flex-[2] px-6 py-4 text-xs font-black uppercase tracking-widest text-white bg-emerald-600 rounded-2xl hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xl shadow-emerald-100 flex items-center justify-center gap-2">
          <i *ngIf="saving" class="spinner-border spinner-border-sm border-2 w-3 h-3"></i>
          {{ saving ? 'Guardando...' : (compromiso ? 'Actualizar' : 'Crear Compromiso') }}
        </button>
      </div>
    </form>
  </div>
</div>
