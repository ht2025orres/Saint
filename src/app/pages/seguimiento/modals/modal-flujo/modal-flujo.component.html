<div *ngIf="show" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" (click)="onCerrar.emit()"></div>
  
  <div class="bg-white rounded-[2.5rem] w-full max-w-md overflow-hidden shadow-2xl z-10 animate-in zoom-in-95 duration-300 text-center p-10">
    <div class="w-20 h-20 bg-emerald-50 rounded-3xl flex items-center justify-center mx-auto mb-6 text-emerald-600 shadow-inner">
      <i class="bi bi-lightning-charge-fill text-4xl"></i>
    </div>
    
    <h3 class="text-2xl font-black text-gray-900 mb-2">Iniciar Jornada</h3>
    <p class="text-gray-500 font-medium mb-8 leading-relaxed">Se creará un nuevo flujo de trabajo para hoy. Podrás registrar compromisos y hacer seguimiento del progreso del equipo.</p>

    <div class="flex flex-col gap-3">
      <button (click)="onConfirmar.emit()" [disabled]="saving"
        class="w-full px-8 py-4 bg-emerald-600 text-white font-black text-xs uppercase tracking-[0.2em] rounded-2xl hover:bg-emerald-700 transition-all shadow-xl shadow-emerald-100 flex items-center justify-center gap-2">
        <i *ngIf="saving" class="spinner-border spinner-border-sm border-2 w-3 h-3"></i>
        {{ saving ? 'Iniciando...' : 'Confirmar Inicio' }}
      </button>
      <button (click)="onCerrar.emit()" [disabled]="saving"
        class="w-full px-8 py-4 bg-white text-gray-400 font-black text-xs uppercase tracking-[0.2em] rounded-2xl hover:bg-gray-50 transition-all">
        Ahora no
      </button>
    </div>
  </div>
</div>
