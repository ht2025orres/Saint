<div *ngIf="show" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm animate-in fade-in duration-300">
  
  <div class="bg-white rounded-[2rem] w-full max-w-lg overflow-hidden shadow-2xl flex flex-col animate-in zoom-in-95 duration-300">
    
    <div class="px-8 py-6 border-b border-gray-100 flex items-center justify-between shrink-0 bg-gray-50/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600">
          <i class="bi bi-list-check text-xl"></i>
        </div>
        <h3 class="text-xl font-black text-gray-900 leading-tight">
          {{ tarea ? 'Editar Tarea' : 'Nueva Tarea de Seguimiento' }}
        </h3>
      </div>
      <button (click)="onCerrar.emit()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 transition-colors">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="flex-1 p-8">
      <form [formGroup]="form" id="tareaForm" (ngSubmit)="submit()" class="space-y-6">
        
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Título de la Tarea</label>
          <input type="text" formControlName="titulo" 
            class="w-full px-5 py-3.5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-bold placeholder:text-gray-300 transition-all outline-none"
            placeholder="¿Qué se debe hacer?">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Responsable</label>
            <select formControlName="responsable_id" 
              class="w-full px-5 py-3.5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-bold outline-none transition-all appearance-none">
              <option [ngValue]="null" disabled>Seleccionar...</option>
              <option *ngFor="let u of usuarios" [value]="u.id">{{ u.nombre }}</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Estado</label>
            <select formControlName="estado" 
              class="w-full px-5 py-3.5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-bold outline-none transition-all appearance-none">
              <option *ngFor="let e of estados" [value]="e">{{ e | titlecase }}</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Fecha Límite</label>
          <input type="date" formControlName="fecha_limite_entrega" 
            class="w-full px-5 py-3.5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-bold outline-none transition-all">
        </div>

        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Notas Adicionales</label>
          <textarea formControlName="descripcion" rows="3"
            class="w-full px-5 py-3.5 bg-gray-50 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-xl text-gray-900 font-bold placeholder:text-gray-300 transition-all outline-none resize-none"
            placeholder="Opcional..."></textarea>
        </div>

      </form>
    </div>

    <div class="px-8 py-6 bg-gray-50 border-t border-gray-100 flex items-center justify-end gap-3 shrink-0">
      <button (click)="onCerrar.emit()" [disabled]="saving"
        class="px-6 py-3 text-xs font-black text-gray-500 uppercase tracking-widest hover:text-gray-700 transition-colors disabled:opacity-50">
        Cancelar
      </button>
      <button form="tareaForm" type="submit" [disabled]="form.invalid || saving"
        class="px-8 py-3 bg-blue-600 text-white text-xs font-black uppercase tracking-widest rounded-xl hover:bg-blue-700 transition-all shadow-xl shadow-blue-100 disabled:opacity-50 disabled:shadow-none flex items-center gap-2">
        <i *ngIf="saving" class="bi bi-arrow-repeat animate-spin"></i>
        {{ saving ? 'Guardando...' : 'Guardar Tarea' }}
      </button>
    </div>

  </div>
</div>
