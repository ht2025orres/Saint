<div *ngIf="show"
  class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300"
  (click)="onCerrar.emit()">

  <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 animate-in zoom-in-95 duration-300 flex flex-col max-h-[90vh]"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="relative px-8 py-6 border-b border-slate-100 bg-slate-50/50 shrink-0">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-lg shadow-amber-100">
          <i class="mdi mdi-layers-triple text-2xl"></i>
        </div>
        <div>
          <h2 class="font-black text-slate-800 text-xl tracking-tight">Cargar Plantilla</h2>
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Importar estructura predefinida</p>
        </div>
      </div>
      <button (click)="onCerrar.emit()"
        class="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition-all">
        <i class="mdi mdi-close"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-8">

      <div *ngIf="loading" class="flex flex-col items-center py-12">
        <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Buscando plantillas...</p>
      </div>

      <div *ngIf="!loading && plantillas.length === 0" class="text-center py-12">
        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-dashed border-slate-200">
          <i class="mdi mdi-folder-open-outline text-slate-300 text-4xl"></i>
        </div>
        <p class="text-slate-500 font-black text-sm">No hay plantillas disponibles</p>
        <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-2 px-6">
          Puedes crear una plantilla desde el menú de opciones de cualquier proyecto existente.
        </p>
      </div>

      <div *ngIf="!loading && plantillas.length > 0" class="space-y-3">
        <div *ngFor="let p of plantillas"
          (click)="onSeleccionar.emit(p)"
          class="group p-4 border-2 border-slate-50 rounded-2xl hover:border-amber-400 hover:bg-amber-50/30
                 cursor-pointer transition-all flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-white border border-slate-100 text-slate-400 flex items-center justify-center
                      group-hover:bg-amber-500 group-hover:text-white group-hover:border-amber-500 transition-all shadow-sm">
            <i class="mdi mdi-file-document-outline text-2xl"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="font-black text-slate-800 text-sm group-hover:text-amber-600 transition-colors truncate">
              {{ p.titulo }}
            </h4>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest line-clamp-1 mt-0.5">
              {{ p.descripcion || 'Sin descripción detallada' }}
            </p>
          </div>
          <div class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-white group-hover:text-amber-500 transition-all shadow-sm">
            <i class="mdi mdi-chevron-right text-xl"></i>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="px-8 py-6 bg-slate-50 border-t border-slate-100 flex justify-end shrink-0">
      <button (click)="onCerrar.emit()"
        class="px-6 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-slate-600 transition-all">
        Cancelar operación
      </button>
    </div>
  </div>
</div>
