<section id="wrapper">
  <div class="login-register" style="background-image:url(../../../assets/images/loginBackground.jpg);">
    <div class="card login-box">
      <div class="card-body">
        
        <form class="form-control-line"
              [formGroup]="formGr"
              (ngSubmit)="sendRecoveryLink()">
          <div class="text-center mb-4">
            <img src="../../../assets/images/logo.png" class="img-responsive" alt="Logo Providencia">
            <h4 class="mt-3 font-weight-bold" style="color: #002A3F;">Recuperar Contraseña</h4>
            <p class="text-muted" style="font-size: 0.85rem;">
              Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
            </p>
          </div>

          <div class="form-group" [class.has-danger]="emailNoValid">
            <div class="col-xs-12">
              <label class="form-control-label" *ngIf="emailNoValid">
                Ingresa un correo válido
              </label>
              <input class="form-control"
                     type="text"
                     formControlName="email"
                     [class.form-control-danger]="emailNoValid"
                     placeholder="Correo Electrónico">
            </div>
          </div>

          <div class="form-group text-center mt-4">
            <div class="col-xs-12">
              <button class="btn btn-block btn-lg btn-themecolor btn-rounded"
                      type="submit"
                      [disabled]="formGr.invalid || loading"
                      [style.cursor]="validateCursor()"
                      style="opacity: .85; width: 100%;">
                {{ loading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
              </button>
            </div>
          </div>

          <div class="form-group text-center mt-3 mb-0">
            <div class="col-xs-12">
              <a routerLink="/login" class="text-info" style="font-size: 0.9rem; text-decoration: none;">
                <i class="bi bi-arrow-left"></i> Volver al Login
              </a>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
