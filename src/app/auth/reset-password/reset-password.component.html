<section id="wrapper">
  <div class="login-register" style="background-image:url(../../../assets/images/loginBackground.jpg);">
    <div class="card login-box">
      <div class="card-body">
        
        <form class="form-control-line"
              [formGroup]="formGr"
              (ngSubmit)="resetPassword()">
          <div class="text-center mb-4">
            <img src="../../../assets/images/logo.png" class="img-responsive" alt="Logo Providencia">
            <h4 class="mt-3 font-weight-bold" style="color: #002A3F;">Nueva Contraseña</h4>
            <p class="text-muted" style="font-size: 0.85rem;">
              Establece tu nueva contraseña de acceso.
            </p>
          </div>

          <div class="form-group" [class.has-danger]="passwordNoValid">
            <div class="col-xs-12">
              <label class="form-control-label" *ngIf="passwordNoValid">
                La contraseña debe tener mínimo 8 caracteres
              </label>
              <input class="form-control"
                     type="password"
                     formControlName="password"
                     [class.form-control-danger]="passwordNoValid"
                     placeholder="Nueva Contraseña (mínimo 8 caracteres)">
            </div>
          </div>

          <div class="form-group" [class.has-danger]="confirmNoValid">
            <div class="col-xs-12">
              <label class="form-control-label" *ngIf="confirmNoValid">
                <span *ngIf="formGr.get('password_confirmation').hasError('required')">Confirma la contraseña</span>
                <span *ngIf="formGr.hasError('passwordMismatch')">Las contraseñas no coinciden</span>
              </label>
              <input class="form-control"
                     type="password"
                     formControlName="password_confirmation"
                     [class.form-control-danger]="confirmNoValid"
                     placeholder="Confirmar Contraseña">
            </div>
          </div>

          <div class="form-group text-center mt-4">
            <div class="col-xs-12">
              <button class="btn btn-block btn-lg btn-themecolor btn-rounded"
                      type="submit"
                      [disabled]="formGr.invalid || loading"
                      [style.cursor]="validateCursor()"
                      style="opacity: .85; width: 100%;">
                {{ loading ? 'Actualizando...' : 'Restablecer contraseña' }}
              </button>
            </div>
          </div>

          <div class="form-group text-center mt-3 mb-0">
            <div class="col-xs-12">
              <a routerLink="/login" class="text-info" style="font-size: 0.9rem; text-decoration: none;">
                Volver al Login
              </a>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
