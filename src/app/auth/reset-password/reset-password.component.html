<section id="wrapper">
  <div class="login-register" style="background-image:url(../../../assets/images/loginBackground.jpg);">

    <div class="card login-box">
      <div class="card-body">

        <form [formGroup]="formGr" (ngSubmit)="resetPassword()" class="form-control-line">
          <!-- Logo -->
          <div class="text-center mb-2">
            <img src="../../../assets/images/logo.png" class="img-responsive">
          </div>

          <!-- Encabezado con icono decorativo -->
          <div class="text-center mb-4">
            <div class="mx-auto mb-3 flex items-center justify-center w-14 h-14 rounded-full"
                 style="background: linear-gradient(135deg, #dcfce7, #d1fae5);">
              <i class="bi bi-shield-lock text-2xl" style="color: #002A3F;"></i>
            </div>
            <h4 class="font-bold text-lg tracking-tight" style="color: #002A3F;">Nueva Contraseña</h4>
            <p class="text-muted text-xs mt-1 px-2" style="line-height: 1.6;">
              Establece tu nueva contraseña de acceso al sistema.
            </p>
          </div>

          <!-- Campo Contraseña -->
          <div class="form-group" [class.has-danger]="passwordNoValid">
            <div class="col-xs-12">
              <label class="text-xs font-semibold text-uppercase d-block mb-1"
                     style="color: #6b7280; letter-spacing: 0.05em; font-size: 0.7rem;">
                Nueva Contraseña
              </label>
              <div class="relative">
                <span class="absolute left-0 top-0 bottom-0 flex items-center pl-3 pointer-events-none" style="z-index:2;">
                  <i class="bi bi-key" style="color: #94a3b8; font-size: 0.85rem;"></i>
                </span>
                <input id="password"
                       type="password"
                       formControlName="password"
                       class="form-control"
                       [class.form-control-danger]="passwordNoValid"
                       placeholder="Mínimo 8 caracteres"
                       style="padding-left: 2.2rem; border-radius: 10px; height: 42px; font-size: 0.9rem; border: 1.5px solid #e2e8f0; transition: all 0.2s ease;">
              </div>
              <label class="form-control-label mt-1" *ngIf="passwordNoValid"
                     style="font-size: 0.75rem; color: #ef4444; display: flex; align-items: center; gap: 4px;">
                <i class="bi bi-exclamation-circle-fill"></i> La contraseña debe tener al menos 8 caracteres.
              </label>
            </div>
          </div>

          <!-- Campo Confirmación -->
          <div class="form-group" [class.has-danger]="confirmNoValid">
            <div class="col-xs-12">
              <label class="text-xs font-semibold text-uppercase d-block mb-1"
                     style="color: #6b7280; letter-spacing: 0.05em; font-size: 0.7rem;">
                Confirmar Contraseña
              </label>
              <div class="relative">
                <span class="absolute left-0 top-0 bottom-0 flex items-center pl-3 pointer-events-none" style="z-index:2;">
                  <i class="bi bi-lock" style="color: #94a3b8; font-size: 0.85rem;"></i>
                </span>
                <input id="password_confirmation"
                       type="password"
                       formControlName="password_confirmation"
                       class="form-control"
                       [class.form-control-danger]="confirmNoValid"
                       placeholder="Repite la contraseña anterior"
                       style="padding-left: 2.2rem; border-radius: 10px; height: 42px; font-size: 0.9rem; border: 1.5px solid #e2e8f0; transition: all 0.2s ease;">
              </div>
              <div *ngIf="confirmNoValid"
                   style="font-size: 0.75rem; color: #ef4444; display: flex; align-items: center; gap: 4px; margin-top: 4px;">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span *ngIf="formGr.get('password_confirmation').hasError('required')">Por favor confirma la contraseña.</span>
                <span *ngIf="formGr.hasError('passwordMismatch') && !formGr.get('password_confirmation').hasError('required')">Las contraseñas no coinciden.</span>
              </div>
            </div>
          </div>

          <!-- Botón Restablecer -->
          <div class="form-group text-center">
            <div class="col-xs-12 pt-2">
              <button type="submit"
                      [disabled]="formGr.invalid || loading"
                      [style.cursor]="validateCursor()"
                      class="btn btn-block btn-lg btn-rounded text-white d-flex align-items-center justify-content-center"
                      style="background: linear-gradient(135deg, #002A3F, #004567); border: none; width: 100%; opacity: 0.9; border-radius: 10px; height: 44px; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.02em; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0, 42, 63, 0.25);">
                <svg *ngIf="loading" class="animate-spin mr-2" style="width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                {{ loading ? 'Actualizando...' : 'Restablecer contraseña' }}
              </button>
            </div>
          </div>

          <!-- Enlace Volver -->
          <div class="form-group text-center mt-2 mb-0">
            <div class="col-xs-12">
              <a routerLink="/login" style="font-size: 0.85rem; text-decoration: none; color: #64748b; transition: color 0.2s ease;">
                <i class="bi bi-arrow-left mr-1" style="transition: transform 0.2s ease;"></i> Volver al Login
              </a>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
